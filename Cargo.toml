[package]
name = "bm25"
version = "0.0.2"
authors = ["psyche"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "bm25"
path = "bm25/lib.rs"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
rmp-serde = "1"
rayon = "1"


[dependencies.pyo3]
version = "0.23"
features = ["extension-module"]

[profile.release]
lto = true
codegen-units = 1
